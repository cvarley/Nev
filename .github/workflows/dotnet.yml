# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Diagnose ONNX model files
      if: always()
      run: |
        for path in \
          "Nev.Core/Model/English/model.onnx" \
          "Nev.Test/bin/Release/net10.0/Model/English/model.onnx"; do
          echo "::group::$path"
          if [ -f "$path" ]; then
            stat --printf='size=%s bytes\n' "$path"
            sha256sum "$path"
            file "$path"
            printf 'first 32 bytes (hex):'
            od -An -tx1 -N32 "$path"
            if head -c 100 "$path" | grep -aq '^version https://git-lfs.github.com/spec/v1'; then
              echo 'Git LFS pointer detected instead of model data'
            fi
          else
            echo 'File is missing'
          fi
          echo '::endgroup::'
        done
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=Integration"
